name: KORAX NEWS Auto Publisher

on:
  push:
    branches: [main]
    paths:
      - 'bot.py'
      - 'sources.json'
      - 'requirements.txt'
      - 'fixtures.py'
      - 'fixtures.json'
      - 'test_fixtures.py'
      - '.github/workflows/publish-fixtures.yml'
      - '.github/workflows/publish-news.yml'
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: korax-publishers
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax and news image tests
        run: |
          python -m py_compile bot.py
          python -m unittest -v test_news.py

      - name: Fetch and publish new football news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: python bot.py

      - name: Merge and save duplicate-prevention state safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main

            python - <<'PY'
          import json
          import subprocess

          path = "seen_news.json"
          try:
              remote_raw = subprocess.check_output(
                  ["git", "show", "origin/main:" + path], text=True
              )
              remote = json.loads(remote_raw)
          except Exception:
              remote = {}

          try:
              with open(path, encoding="utf-8") as file:
                  local = json.load(file)
          except Exception:
              local = {}

          merged = {}
          for key, limit in (("seen", 12000), ("titles", 12000)):
              values = list(dict.fromkeys(remote.get(key, []) + local.get(key, [])))
              merged[key] = values[-limit:]

          stories = list(dict.fromkeys(
              remote.get("story_texts", []) + local.get("story_texts", [])
          ))
          merged["story_texts"] = stories[-12000:]

          with open(path, "w", encoding="utf-8") as file:
              json.dump(merged, file, ensure_ascii=False, indent=2)
          PY

            git add seen_news.json
            if git diff --cached --quiet; then
              echo "News state is already up to date."
              exit 0
            fi

            git commit -m "Update published news state"
            if git push origin HEAD:main; then
              echo "News state saved."
              exit 0
            fi

            echo "State push raced another workflow; merging remote state and retrying."
            git reset --soft origin/main
          done

          echo "Could not save merged news state after three attempts."
          exit 1
